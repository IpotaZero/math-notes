<script>
(() => {
  const MARGIN = 8;
  let current;

  /** node を含む、ポップアップを持つ参照 */
  const owner = (node) => {
    for (let ref = node instanceof Element ? node.closest(".mtr-ref") : null; ref; ref = ref.parentElement?.closest(".mtr-ref")) {
      if (ref.querySelector(":scope > .mtr-ref-popup")) return ref;
    }
    return undefined;
  };

  const place = (ref) => {
    const popup = ref.querySelector(":scope > .mtr-ref-popup");
    const lines = ref.querySelector(":scope > a")?.getClientRects() ?? [];
    if (lines.length === 0) return;
    const first = lines[0];
    const last = lines[lines.length - 1];
    const style = popup.style;
    style.position = "fixed";
    style.maxHeight = "none";
    const height = popup.offsetHeight;
    const below = innerHeight - last.bottom - MARGIN;
    const above = first.top - MARGIN;
    const down = height <= below || below >= above;
    const anchor = down ? last : first;
    style.top = down ? last.bottom + "px" : "auto";
    style.bottom = down ? "auto" : innerHeight - first.top + "px";
    style.maxHeight = Math.max(down ? below : above, 0) + "px";
    style.left = Math.max(MARGIN, Math.min(anchor.left, innerWidth - MARGIN - popup.offsetWidth)) + "px";
  };

  document.addEventListener("mouseover", (event) => {
    const ref = owner(event.target);
    if (ref === undefined || ref.contains(event.relatedTarget)) return;
    current = ref;
    place(ref);
  });
  const follow = () => current?.matches(":hover") && place(current);
  addEventListener("scroll", follow, { passive: true });
  addEventListener("resize", follow);
})();
</script>
<script>
(() => {
  const { endpoint, documentKey } = {"endpoint":"https://script.google.com/macros/s/AKfycbzNFIHIx9wnndXFI9vyMKv_w8BXXpdlZ_xXUIoXRjuaokGkGjluwjlgnh-27LgV-unIKg/exec","documentKey":"category/#0"};
  const SECRETS = "mtr-memo-secrets";
  const NAME = "mtr-memo-name";

  // localStorage が使えない(プライベートウィンドウなど)ときは覚えないだけ
  const load = (key, fallback) => {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
  };
  const save = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  };

  const unwrap = async (response) => {
    const body = await response.json();
    if (body.error !== undefined) throw new Error(body.error);
    return body;
  };
  const get = () => fetch(endpoint + "?document=" + encodeURIComponent(documentKey)).then(unwrap);
  // text/plain ならプリフライトなしで送れる
  const post = (request) =>
    fetch(endpoint, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(request) }).then(unwrap);

  const element = (tag, properties, ...children) => {
    const node = Object.assign(document.createElement(tag), properties);
    node.append(...children);
    return node;
  };
  const randomKey = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
  const formatTime = (time) => new Date(time).toLocaleString("ja-JP", { dateStyle: "medium", timeStyle: "short" });

  /** address → 環境のメモ欄 */
  const boxes = new Map();

  class MemoBox {
    constructor(section) {
      this.address = section.dataset.address;
      this.memos = [];
      this.count = element("span", { className: "mtr-memo-count" });
      this.toggle = element("button", { type: "button", className: "mtr-memo-toggle" }, "メモ", this.count);
      this.toggle.setAttribute("aria-expanded", "false");
      this.list = element("ul", { className: "mtr-memo-list" });
      this.text = element("textarea", { name: "text", required: true, maxLength: 2000, rows: 3, placeholder: "この環境へのメモ(Ctrl+Enter で書き込む)" });
      this.name = element("input", { name: "name", maxLength: 50, placeholder: "名前(任意)", value: load(NAME, "") });
      this.submit = element("button", { type: "submit" }, "書き込む");
      this.status = element("span", { className: "mtr-memo-status" });
      this.form = element("form", { className: "mtr-memo-form" }, this.text, element("div", {}, this.name, this.submit, this.status));
      this.panel = element("div", { className: "mtr-memo", hidden: true }, this.list, this.form);
      section.querySelector(":scope > .mtr-env-head").append(this.toggle);
      section.append(this.panel);

      this.toggle.addEventListener("click", () => this.open(this.panel.hidden));
      this.text.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) this.form.requestSubmit();
      });
      this.form.addEventListener("submit", (event) => {
        event.preventDefault();
        this.add().catch((error) => (this.status.textContent = "書き込めませんでした: " + error.message));
      });
    }

    open(open) {
      this.panel.hidden = !open;
      this.toggle.setAttribute("aria-expanded", String(open));
      if (open) this.text.focus();
    }

    async add() {
      const secret = randomKey();
      this.submit.disabled = true;
      this.status.textContent = "送信中…";
      try {
        const { memo } = await post({ action: "add", document: documentKey, address: this.address, name: this.name.value, text: this.text.value, secret });
        save(SECRETS, { ...load(SECRETS, {}), [memo.id]: secret });
        save(NAME, this.name.value.trim());
        this.text.value = "";
        this.status.textContent = "";
        this.show([...this.memos, memo]);
      } finally {
        this.submit.disabled = false;
      }
    }

    async remove(memo, secret) {
      if (!confirm("このメモを削除しますか?")) return;
      try {
        await post({ action: "delete", id: memo.id, secret });
        const { [memo.id]: _, ...rest } = load(SECRETS, {});
        save(SECRETS, rest);
        this.show(this.memos.filter((m) => m !== memo));
      } catch (error) {
        this.status.textContent = "削除できませんでした: " + error.message;
      }
    }

    show(memos) {
      this.memos = memos;
      const secrets = load(SECRETS, {});
      this.list.replaceChildren(...memos.map((memo) => {
        const meta = element("div", { className: "mtr-memo-meta" },
          element("span", { className: "mtr-memo-name" }, memo.name || "名無し"),
          element("time", { dateTime: memo.time }, formatTime(memo.time)));
        const secret = secrets[memo.id];
        if (secret !== undefined) {
          const remove = element("button", { type: "button" }, "削除");
          remove.addEventListener("click", () => this.remove(memo, secret));
          meta.append(remove);
        }
        return element("li", {}, meta, element("div", { className: "mtr-memo-text" }, memo.text));
      }));
      this.count.textContent = memos.length === 0 ? "" : String(memos.length);
      this.toggle.classList.toggle("mtr-memo-has", memos.length > 0);
    }
  }

  for (const section of document.querySelectorAll(".mtr-env[data-address]")) {
    const box = new MemoBox(section);
    boxes.set(box.address, box);
  }
  get().then(
    ({ memos }) => {
      for (const box of boxes.values()) box.show(memos.filter((memo) => memo.address === box.address));
    },
    (error) => {
      for (const box of boxes.values()) box.status.textContent = "メモを読み込めませんでした: " + error.message;
    },
  );
})();
</script>
